<style>
/* ---- Renk değişkenleri: gece varsayılan ---- */
:root{
  --zemin:#0F1720;
  --yuzey:#17222D;
  --yuzey2:#1E2B38;
  --cizgi:#27353F;
  --yazi:#DDE5EC;
  --sonuk:#8395A5;
  --vurgu:#E3A85C;
  --vurgu-zemin:rgba(227,168,92,.14);
  --dogru:#62B49B;
  --dogru-zemin:rgba(98,180,155,.16);
  --yanlis:#D4706E;
  --yanlis-zemin:rgba(212,112,110,.16);
  --golge:0 1px 0 rgba(255,255,255,.03);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono","Cascadia Mono",Menlo,Consolas,monospace;
  --metin:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-mod="gunduz"]{
  --zemin:#EBEFF3;
  --yuzey:#FFFFFF;
  --yuzey2:#F4F7F9;
  --cizgi:#D3DCE4;
  --yazi:#16212C;
  --sonuk:#566674;
  --vurgu:#965C14;
  --vurgu-zemin:rgba(150,92,20,.10);
  --dogru:#2F7F68;
  --dogru-zemin:rgba(47,127,104,.12);
  --yanlis:#B24A47;
  --yanlis-zemin:rgba(178,74,71,.12);
  --golge:0 1px 2px rgba(22,33,44,.06);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--zemin);color:var(--yazi);
  font-family:var(--metin);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
code,kbd,pre{font-family:var(--mono)}

/* ---- Üst çubuk ---- */
.ust{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;gap:12px;
  padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:var(--zemin);border-bottom:1px solid var(--cizgi);
}
.ust h1{
  margin:0;font-size:15px;font-weight:600;letter-spacing:.01em;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.ust .kok{font-family:var(--mono);color:var(--vurgu);font-weight:400}
.mod-dugme{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--cizgi);
  display:grid;place-items:center;background:var(--yuzey);flex:none;
}
.mod-dugme svg{width:18px;height:18px;stroke:var(--yazi);fill:none;stroke-width:1.7;stroke-linecap:round}

/* ---- Sayfa gövdesi ---- */
main{max-width:720px;margin:0 auto;padding:16px}
.sayfa{display:none}
.sayfa.acik{display:block}

/* ---- lsblk ağacı: bölüm listesi ---- */
.agac{font-family:var(--mono);font-size:14px;line-height:1.9;margin:4px 0 0}
.agac-baslik{color:var(--sonuk);font-size:12.5px;margin-bottom:6px;letter-spacing:.02em}
.dal{
  display:flex;align-items:baseline;gap:0;width:100%;text-align:left;
  padding:1px 4px;border-radius:6px;
}
.dal:hover,.dal:focus-visible{background:var(--yuzey)}
.dal .cizim{color:var(--sonuk);white-space:pre;flex:none}
.dal .ad{color:var(--yazi);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dal .rozet{color:var(--sonuk);font-size:12px;flex:none;padding-left:8px}
.dal.okundu .ad{color:var(--sonuk)}
.dal.okundu .rozet{color:var(--dogru)}

/* ---- Okuma alanı ---- */
.okuma{font-size:var(--okuma-boyut,16.5px);line-height:1.72;letter-spacing:.002em}
.okuma mark{background:var(--vurgu-zemin);color:var(--vurgu);padding:0 2px;border-radius:3px}
.okuma h2{
  font-size:19px;line-height:1.35;margin:0 0 4px;font-weight:650;
  padding-bottom:10px;border-bottom:2px solid var(--vurgu);
}
.okuma h3{
  font-size:15.5px;font-weight:650;margin:30px 0 8px;line-height:1.4;
  color:var(--yazi);
}
.okuma h3:first-of-type{margin-top:22px}
.okuma p{margin:0 0 14px;max-width:66ch}
.okuma p strong{font-weight:650}
.okuma code{
  font-size:.88em;background:var(--vurgu-zemin);color:var(--vurgu);
  padding:1px 5px;border-radius:4px;word-break:break-word;
}
.okuma pre{
  margin:0 0 16px;padding:12px 14px;overflow-x:auto;
  background:var(--yuzey);border:1px solid var(--cizgi);border-left:3px solid var(--vurgu);
  border-radius:8px;font-size:13.5px;line-height:1.65;
}
.okuma pre code{background:none;color:var(--yazi);padding:0;font-size:inherit}

/* Okuma başlığı ve gezinme */
.okuma-ust{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.okuma-ust .bosluk{flex:1}
.boyut-dugme{
  width:36px;height:34px;border-radius:8px;border:1px solid var(--cizgi);
  background:var(--yuzey);color:var(--yazi);font-family:var(--mono);font-size:13px;flex:none;
}
.boyut-dugme:disabled{opacity:.35}
.devam{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  padding:12px 14px;border-radius:10px;border:1px solid var(--vurgu);
  background:var(--vurgu-zemin);margin-bottom:14px;
}
.devam .ok{color:var(--vurgu);font-family:var(--mono);flex:none}
.devam .yazi{flex:1;min-width:0}
.devam .ust-satir{display:block;font-size:12px;color:var(--sonuk)}
.devam .ad{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fihrist-giris{
  display:flex;align-items:center;justify-content:space-between;width:100%;
  padding:12px 14px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:10px;font-size:14.5px;
}
.fihrist-giris .ok{color:var(--vurgu);font-family:var(--mono)}
.fihrist-satir{
  display:block;width:100%;text-align:left;font-family:var(--mono);font-size:13.5px;
  padding:10px 12px;border-radius:8px;border:1px solid var(--cizgi);
  background:var(--yuzey);margin-bottom:7px;overflow-wrap:anywhere;line-height:1.45;
}
.fihrist-satir:hover{border-color:var(--vurgu)}
.icindekiler{
  display:grid;gap:2px;margin:0 0 20px;padding:12px 14px;
  border-radius:10px;background:var(--yuzey);border:1px solid var(--cizgi);
}
.icindekiler button{
  text-align:left;font-size:13.5px;line-height:1.45;padding:5px 0;color:var(--sonuk);
}
.icindekiler button:hover{color:var(--vurgu)}
.kontrol-oge.sirada{border-color:var(--vurgu);background:var(--vurgu-zemin)}
.metin-basligi{
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);
  margin:20px 0 8px;padding-top:14px;border-top:1px solid var(--cizgi);
}
.kesit{
  font-size:13.5px;line-height:1.55;color:var(--sonuk);margin:0;
  font-family:var(--mono);overflow-wrap:anywhere;
}
.kesit b{color:var(--vurgu);font-weight:600}
.sonuc-kart .adet{font-size:12px;color:var(--sonuk);font-family:var(--mono)}
.geri{
  display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--sonuk);
  padding:6px 10px;border-radius:8px;border:1px solid var(--cizgi);background:var(--yuzey);
}
.okuma-alt{
  display:flex;gap:10px;margin:28px 0 8px;padding-top:18px;border-top:1px solid var(--cizgi);
}
.okuma-alt button{
  flex:1;padding:12px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:14px;color:var(--yazi);
}
.okuma-alt button:disabled{opacity:.35}
.okundu-dugme{
  width:100%;margin-top:12px;padding:12px;border-radius:10px;font-size:14px;
  border:1px solid var(--cizgi);background:var(--yuzey);color:var(--yazi);
}
.okundu-dugme.isaretli{background:var(--dogru-zemin);border-color:var(--dogru);color:var(--dogru)}

/* ---- Arama ---- */
.arama-kutu{position:relative;margin-bottom:8px}
.arama-kutu input{
  width:100%;padding:13px 40px 13px 14px;border-radius:10px;
  border:1px solid var(--cizgi);background:var(--yuzey);font-size:15px;
}
.arama-kutu input:focus{outline:2px solid var(--vurgu);outline-offset:-1px}
.arama-sil{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  width:32px;height:32px;border-radius:8px;color:var(--sonuk);font-size:18px;
}
.oneri{
  list-style:none;margin:0;padding:0;border:1px solid var(--cizgi);border-radius:10px;
  background:var(--yuzey);overflow:hidden;
}
.oneri:empty{display:none}
.oneri li button{
  display:block;width:100%;text-align:left;padding:11px 14px;
  border-bottom:1px solid var(--cizgi);font-size:14.5px;
}
.oneri li:last-child button{border-bottom:0}
.oneri li button:hover,.oneri li button:focus-visible{background:var(--yuzey2)}
.oneri .terim{font-family:var(--mono);color:var(--vurgu);font-size:13.5px}
.oneri .kisa{display:block;color:var(--sonuk);font-size:13px;margin-top:2px;line-height:1.45}

.sonuc{margin-top:14px}
.sonuc-kart{
  border:1px solid var(--cizgi);border-radius:10px;background:var(--yuzey);
  padding:14px;margin-bottom:10px;box-shadow:var(--golge);
}
.sonuc-kart h4{margin:0 0 6px;font-size:14.5px;font-family:var(--mono);color:var(--vurgu);font-weight:500}
.sonuc-kart p{margin:0;font-size:14.5px;line-height:1.6}
.sonuc-kart .nereden{
  display:inline-block;margin-top:10px;font-size:12.5px;color:var(--sonuk);
  border-bottom:1px solid var(--cizgi);
}
.bos{color:var(--sonuk);font-size:14.5px;padding:24px 4px;text-align:center;line-height:1.6}

/* ---- Çalışma ---- */
.mod-liste{display:grid;gap:10px}
.mod-kart{
  display:block;width:100%;text-align:left;padding:14px;border-radius:12px;
  border:1px solid var(--cizgi);background:var(--yuzey);box-shadow:var(--golge);
}
.mod-kart .ad{font-size:15px;font-weight:600;display:block;margin-bottom:3px}
.mod-kart .izah{font-size:13.5px;color:var(--sonuk);line-height:1.5;display:block}
.mod-kart .sayi{font-family:var(--mono);font-size:12.5px;color:var(--vurgu);margin-top:8px;display:block}

.ilerleme{
  display:flex;align-items:center;gap:10px;margin-bottom:16px;
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);
}
.ilerleme .cubuk{flex:1;height:4px;border-radius:2px;background:var(--cizgi);overflow:hidden}
.ilerleme .dolu{height:100%;background:var(--vurgu);transition:width .25s ease}

.soru{
  border:1px solid var(--cizgi);border-radius:12px;background:var(--yuzey);
  padding:16px;margin-bottom:14px;box-shadow:var(--golge);
}
.soru .etiket{
  font-family:var(--mono);font-size:12px;color:var(--vurgu);
  display:block;margin-bottom:8px;
}
.soru .metin{font-size:16px;line-height:1.55;margin:0 0 4px}
.soru pre{
  margin:12px 0 0;padding:11px 12px;background:var(--yuzey2);border:1px solid var(--cizgi);
  border-radius:8px;font-size:13.5px;overflow-x:auto;
}
.secenekler{display:grid;gap:9px;margin-top:14px}
.secenek{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  padding:12px 13px;border-radius:10px;border:1px solid var(--cizgi);
  background:var(--yuzey);font-size:14.5px;line-height:1.5;
}
.secenek .harf{
  font-family:var(--mono);font-size:12.5px;color:var(--sonuk);flex:none;
  width:20px;height:20px;border-radius:5px;border:1px solid var(--cizgi);
  display:grid;place-items:center;margin-top:1px;
}
.secenek:hover:not(:disabled){border-color:var(--vurgu)}
.secenek.dogru{background:var(--dogru-zemin);border-color:var(--dogru)}
.secenek.dogru .harf{border-color:var(--dogru);color:var(--dogru)}
.secenek.yanlis{background:var(--yanlis-zemin);border-color:var(--yanlis)}
.secenek.yanlis .harf{border-color:var(--yanlis);color:var(--yanlis)}
.secenek:disabled{cursor:default;opacity:1}

/* Komut dizme */
.dizi-alan{
  min-height:52px;margin-top:14px;padding:10px;border-radius:10px;
  border:1px dashed var(--cizgi);background:var(--yuzey2);
  display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;
}
.dizi-alan.bos-alan::before{
  content:attr(data-ipucu);color:var(--sonuk);font-size:13px;font-family:var(--metin);
}
.havuz{display:flex;flex-wrap:wrap;gap:7px;margin-top:12px}
.parca{
  font-family:var(--mono);font-size:13.5px;padding:8px 11px;border-radius:8px;
  border:1px solid var(--cizgi);background:var(--yuzey);line-height:1.3;
  overflow-wrap:anywhere;max-width:100%;text-align:left;
}
.parca:hover{border-color:var(--vurgu)}
.dizi-alan .parca{background:var(--vurgu-zemin);border-color:var(--vurgu);color:var(--yazi)}
.dizi-alan.dogru-alan{border-style:solid;border-color:var(--dogru);background:var(--dogru-zemin)}
.dizi-alan.yanlis-alan{border-style:solid;border-color:var(--yanlis);background:var(--yanlis-zemin)}

/* Eşleştirme */
.esles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.esles-sutun{display:grid;gap:8px;align-content:start}
.esles-oge{
  padding:11px 10px;border-radius:9px;border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:13px;line-height:1.4;text-align:left;min-height:44px;
  overflow-wrap:anywhere;min-width:0;
}
.esles-oge.sag{font-family:var(--mono);font-size:12.5px}
.esles-oge.secili{border-color:var(--vurgu);background:var(--vurgu-zemin)}
.esles-oge.tamam{border-color:var(--dogru);background:var(--dogru-zemin);color:var(--dogru);cursor:default}
.esles-oge.hata{border-color:var(--yanlis);background:var(--yanlis-zemin)}

/* Kart (flashcard) */
.kart{
  border:1px solid var(--cizgi);border-radius:14px;background:var(--yuzey);
  padding:26px 18px;min-height:210px;display:flex;flex-direction:column;
  justify-content:center;gap:14px;text-align:center;box-shadow:var(--golge);
}
.kart .on{font-size:19px;font-weight:600;line-height:1.4}
.kart .on.komut{font-family:var(--mono);font-size:16px;font-weight:500;color:var(--vurgu)}
.kart .arka{font-size:15px;line-height:1.6;color:var(--yazi);text-align:left}
.kart .ipucu{font-size:13px;color:var(--sonuk)}

/* İzah kutusu */
.izah{
  margin-top:14px;padding:12px 13px;border-radius:9px;
  background:var(--yuzey2);border-left:3px solid var(--vurgu);
  font-size:14px;line-height:1.6;
}
.izah .nereden{display:block;margin-top:7px;font-size:12.5px;color:var(--sonuk)}

/* Kontrol listesi */
.kontrol{display:grid;gap:9px}
.kontrol-oge{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  padding:13px;border-radius:10px;border:1px solid var(--cizgi);background:var(--yuzey);
  font-size:14.5px;line-height:1.5;
}
.kutucuk{
  flex:none;width:21px;height:21px;border-radius:6px;border:1.5px solid var(--cizgi);
  display:grid;place-items:center;margin-top:1px;font-size:13px;color:transparent;
}
.kontrol-oge.tikli .kutucuk{background:var(--dogru);border-color:var(--dogru);color:var(--zemin)}
.kontrol-oge.tikli{color:var(--sonuk)}

/* Alt eylem düğmeleri */
.eylem{display:flex;gap:10px;margin-top:16px}
.eylem button{
  flex:1;padding:13px;border-radius:10px;font-size:14.5px;font-weight:550;
  border:1px solid var(--cizgi);background:var(--yuzey);color:var(--yazi);
}
.eylem button.ana{background:var(--vurgu);border-color:var(--vurgu);color:#12181F}
html[data-mod="gunduz"] .eylem button.ana{color:#FFF}
html[data-mod="gunduz"] .okuma mark{background:rgba(150,92,20,.16)}
.eylem button:disabled{opacity:.4}

/* Sonuç ekranı */
.bitis{text-align:center;padding:30px 10px}
.bitis .puan{font-family:var(--mono);font-size:40px;color:var(--vurgu);line-height:1.1}
.bitis .alt{color:var(--sonuk);font-size:14.5px;margin-top:8px}
.bitis .yanlislar{margin-top:24px;text-align:left}
.bitis .yanlislar h4{margin:0 0 10px;font-size:14px;color:var(--sonuk);font-weight:600}

/* ---- Alt gezinme ---- */
.alt-cubuk{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  display:grid;grid-template-columns:repeat(4,1fr);
  background:var(--yuzey);border-top:1px solid var(--cizgi);
  padding-bottom:env(safe-area-inset-bottom);
}
.alt-cubuk button{
  padding:9px 4px 10px;display:grid;justify-items:center;gap:3px;
  font-size:11px;color:var(--sonuk);
}
.alt-cubuk button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.alt-cubuk button.etkin{color:var(--vurgu)}

/* ---- Kurulum şeridi ---- */
.kurulum{
  position:fixed;left:10px;right:10px;z-index:50;
  bottom:calc(72px + env(safe-area-inset-bottom));
  background:var(--yuzey);border:1px solid var(--vurgu);border-radius:14px;
  padding:14px;box-shadow:0 8px 28px rgba(0,0,0,.28);
}
.kurulum .baslik{font-size:14.5px;font-weight:600;margin:0 0 4px}
.kurulum .metin{font-size:13.5px;color:var(--sonuk);margin:0;line-height:1.5}
.kurulum .adimlar{margin:10px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65;color:var(--yazi)}
.kurulum .adimlar li{margin-bottom:3px}
.kurulum .eylem{margin-top:12px}
.kurulum .eylem button{padding:11px;font-size:14px}

:focus-visible{outline:2px solid var(--vurgu);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (min-width:640px){
  body{font-size:17px}
}

# Born2beRoot Malumatnamesi

## Giriş — Bu Rehberi Nasıl Kullanmalısın

### Projenin amacı ve değerlendirme mantığı
Born2beRoot, 42 müfredatının ilk sistem yönetimi projesi. Amaç: VirtualBox (ya da UTM) içinde Debian tabanlı, GUI'siz, minimal ve güvenli bir sunucu kurup katı kurallara göre yapılandırmak. Değerlendirme "kod oku" şeklinde değil — bir peer (ya da personel) VM'ini AÇIP CANLI geziyor: SSH ile bağlanıyor, sudo deniyor, yeni kullanıcı açtırıyor, monitoring.sh'i durdurmanı istiyor, hostname değiştirtiyor. Bilmen gereken şey ezberlenmiş bir kurulum değil, YAŞAYAN bir sistemi anlık açıklayabilme becerisi.

### Hızlı Kavram Sözlüğü — okumaya başlamadan önce göz at
```
VM (Sanal Makine) : Fiziksel bilgisayar içinde çalışan, bağımsız bir bilgisayar simülasyonu
Hypervisor         : VM oluşturup yöneten yazılım (VirtualBox, UTM gibi)
Partition          : Bir diskin ayrılmış bölümü
Mount point        : Bir partition'ın dizin ağacında göründüğü yer (/, /boot, /home gibi)

```

## 1. Sanallaştırma Temelleri: VirtualBox ve UTM

### Sanal makine (VM) ve hypervisor kavramı
Sanal makine (VM), fiziksel bilgisayarının içinde çalışan, kendi sanal donanımına (CPU, RAM, disk, ağ kartı) sahip bağımsız bir bilgisayar simülasyonudur. Bunu mümkün kılan yazılıma hypervisor denir; VirtualBox ve UTM birer hypervisor'dür (Tip-2, yani normal işletim sisteminin üzerinde bir uygulama gibi çalışırlar). VM sayesinde ana makineni bozma riski olmadan sıfırdan bir Linux sunucusu deneyebilirsin.

### VirtualBox'ta yeni VM oluşturma adımları (RAM, sanal disk, ISO bağlama)
Yeni > isim ve tip (Linux/Debian) seç > RAM ayarla (1-2GB genelde yeterli, projede performans değil doğruluk önemli) > "Sanal sabit disk oluştur" seç, VDI formatı, "dinamik olarak ayrılan" boyut (ör. 8-10GB, ihtiyaca göre büyür) > Ayarlar > Depolama'dan indirdiğin .iso dosyasını sanal CD sürücüsüne bağla > Başlat, kurulum sihirbazı açılır.

### UTM ne zaman kullanılır (Apple Silicon durumu)
Apple Silicon (M1/M2/M3) Mac'lerde VirtualBox resmi olarak desteklenmiyor; bu durumda UTM (QEMU tabanlı) kullanılır. UTM'de disk dosyası .qcow2 uzantılıdır, VirtualBox'taki .vdi'nin karşılığıdır — signature.txt için hash alırken bunu unutma.

### .vdi / .qcow2 disk dosyaları: ne işe yarar, nerede saklanır
Bunlar VM'inin sanal sabit diskini temsil eden dosyalardır; kurduğun işletim sisteminin tamamı (partition'lar, dosyalar, her şey) içinde saklanır. Windows'ta `%HOMEDRIVE%%HOMEPATH%\VirtualBox VMs\`, Linux/Mac'te `~/VirtualBox VMs/` altında bulunur (UTM için `~/Library/Containers/com.utmapp.UTM/Data/Documents/`). Bu dosyayı ASLA git'e eklemeyeceksin — signature.txt için sadece hash'ini alacaksın.

### Ağ modu ve port yönlendirme: SSH'a dışarıdan nasıl ulaşılır
VirtualBox varsayılan olarak NAT modu kullanır — VM dışarı çıkabilir ama dışarıdan VM'e DOĞRUDAN ulaşılamaz. Değerlendiricinin (ya da host'un) VM'in SSH'ına (4242) bağlanabilmesi için Ayarlar > Ağ > Gelişmiş > Port Yönlendirme'den bir kural eklemen gerekir: host'ta bir port → guest'te 4242. Alternatif: ağ modunu "Köprülenmiş Adaptör" (Bridged) yaparsan VM ağında kendi IP'sini alır, doğrudan o IP + 4242 ile erişilir, port yönlendirmeye gerek kalmaz — savunmalarda genelde bu daha sorunsuzdur. Bölüm 6'daki SSH ayarları bu adım olmadan dışarıdan test edilemez.

## 2. İşletim Sistemi Seçimi: Debian vs Rocky Linux

### Debian ailesi ile Rocky/RHEL ailesi arasındaki köken farkı
Debian, bağımsız, topluluk odaklı bir dağıtımdır; Ubuntu dahil pek çok dağıtımın atasıdır. Rocky Linux ise CentOS'un yerini almak için kurulan, Red Hat Enterprise Linux (RHEL) ile ikili-uyumlu (binary compatible) kurumsal bir dağıtımdır. İki aile de aynı Linux çekirdeğini kullanır ama paket formatı, dosya düzeni gelenekleri ve güvenlik araçları farklıdır.

### Paket yönetimi: apt / aptitude / dpkg ile dnf / rpm karşılaştırması
Debian ailesi .deb paketlerini apt (üst seviye, bağımlılık çözer) ve dpkg (alt seviye, tek paket kurar) ile yönetir; aptitude, apt'a benzer ama farklı bir bağımlılık çözme stratejisi ve arayüz sunan alternatif bir ön yüzdür — ikisi de dpkg'yi kullanır. Rocky ailesi .rpm paketlerini dnf (yum'un yerini alan modern araç) ile yönetir. Savunmada "apt ile aptitude farkı nedir" sorulabileceği subject'te açıkça yazıyor — bu tanımı ezberle.

### Hangi durumda hangisi tercih edilir
Subject açıkça "sistem yönetimine yeniyseniz Debian önerilir" diyor, üstelik "Rocky kurulumu oldukça karmaşık" diye ayrıca uyarıyor. Sen Debian/Rocky'nin hiçbirini bilmiyorsun ama Ubuntu ile çalışacaksın — Ubuntu, Debian'ın türevi; apt, dpkg, systemd, hatta varsayılan AppArmor kullanımı bile Debian ile neredeyse birebir örtüşüyor. Ubuntu'da öğrendiğin refleksler doğrudan buraya taşınır. Bu yüzden bu rehberde **Debian ana hat**, Rocky ise karşılaştırma bilgisi olarak işleniyor.

### README'deki "Debian vs Rocky" karşılaştırması için not noktaları
README'nin "Project description" bölümü bu karşılaştırmayı zorunlu kılıyor. Not tutman gereken eksen: köken (bağımsız topluluk vs RHEL-uyumlu kurumsal), paket yönetimi (apt/dpkg vs dnf/rpm), varsayılan MAC aracı (AppArmor vs SELinux), varsayılan firewall (ufw vs firewalld), öğrenme eğrisi (Debian daha yumuşak, Rocky kurumsal ortamlarda daha yaygın).

## 3. Minimal Sunucu Kurulumu

### Neden grafik arayüz (X.org / Wayland) yasak — sunucu felsefesi
Sunucu, arka planda hizmet veren, önünde oturup fare tıklamadığın bir makinedir. X.org/Wayland gibi grafik sunucuları hem gereksiz kaynak tüketir hem de saldırı yüzeyini büyütür (daha fazla paket = daha fazla güvenlik açığı ihtimali). Subject bunu, kurulu bulunursa notunun SIFIR olacağı kadar ciddiye alıyor — kurulum sırasında "masaüstü ortamı" (GNOME, Xfce vb.) seçeneğini KESİNLİKLE işaretleme.

### Netinstall / minimal kurulum akışı
Debian netinst ISO'sunu indir (küçük boyutlu, kurulum sırasında internetten paket çeker). Sihirbazda: dil/klavye seç > hostname gir (login+42 formatında, örn. hyahyato42 — baştan doğru gir) > disk partisyonlama ekranına gel (bkz. bölüm 4) > paket seçim ekranında SADECE "SSH server" ve "standard system utilities" işaretli kalsın, masaüstü ortamı seçeneklerini MUTLAKA kaldır.

### Kurulum sırasında dikkat edilecek ekranlar (disk, ağ, paket seçimi)
En kritik üç an: (1) partisyon ekranı — "Manuel" seçip LVM+şifreleme adımını sen yöneteceksin, (2) paket seçim ekranı — masaüstü ortamı işaretlerini temizle, (3) GRUB boot loader ekranı — ana diske kurulmasını onayla, aksi halde VM açılmaz.

### Klavye düzeni tuzağı
Kurulumda seçtiğin klavye düzeni, sonradan parola yazarken de geçerli olur. Türkçe düzende `q w x` ve özellikle `. , : / -` gibi işaretler İngilizce düzendekinden farklı tuşlara düşer. Parolanda özel karakter varsa ve düzen beklediğinden farklıysa doğru parolayı yazdığın hâlde giremezsin — üstelik ekranda yıldız göründüğü için sebebini de göremezsin. İki korunma yolu: kurulumda hangi düzeni seçtiğini not et, ya da parolayı yalnızca harf ve rakamdan kur (politika zaten büyük/küçük harf + rakam istiyor, özel karakter şart değil). Aynı tuzak LUKS parolası için de geçerli ve orada bedeli daha ağır: diski açamazsan kurulumu baştan yapmak zorunda kalırsın.

### Kurulumdan sonra GUI kalıntısı sızmadığını doğrulama
```bash
dpkg -l | grep -iE 'xserver|wayland|gnome|xfce'
```
Bu komut boş dönmeli. Bir şey listelenirse `sudo apt purge <paket>` ile kaldır — GUI kalıntısı savunmada doğrudan not kaybı demektir, kurulumdan hemen sonra kontrol etmeyi alışkanlık haline getir.

### Kurulum bitince muhtemelen elle kurman gereken paketler
Minimal netinstall'da "SSH server" + "standard system utilities" dışında çoğu şey yok — özellikle `sudo` ve `ufw` çoğu zaman kurulu GELMEZ:
```bash
apt install sudo ufw
```
(root olarak, çünkü henüz sudo yok). Bu adım atlanırsa bölüm 7 (firewall) ve bölüm 11 (sudo) çalışmaya başlayamaz bile.

### Kurulumdan sonraki iş sırası
Karışmasın diye net bir sıra: (1) GUI kalıntısı var mı diye bak, (2) root'a geçip `sudo` ve `ufw` paketlerini kur, kendini sudo grubuna ekle, (3) SSH'ı 4242'ye taşıyıp port yönlendirmeyi ayarla ve ana makineden bağlanabildiğini doğrula. Üçüncü adım bittiği anda projenin geri kalanını host terminalinden, kopyala-yapıştır ederek yapabilirsin (bölüm 6) — bu yüzden onu erkene almak baştaki en kârlı yatırımdır.

### İlk açılışta root'a geçmek ve dosyaları düzenlemek
Kurulumdan sonra kendi kullanıcınla giriş yaparsın, ama o kullanıcı henüz sudo grubunda değildir. Root'a şöyle geçersin:
```bash
su -
```
(kurulumda belirlediğin root parolasını ister; `-` işareti root'un kendi ortamını da yükler). Root'ken `apt install sudo ufw` yapar, kendini sudo grubuna ekler (bölüm 9), sonra `exit` ile kendi kullanıcına dönersin.

Config dosyalarını düzenlemek için grafik arayüz olmadığından terminal editörü kullanacaksın: `nano` (basit; kaydet Ctrl+O, çık Ctrl+X) ya da `vim`. Minimal kurulumda ikisi de gelmemiş olabilir, o zaman `apt install nano` yeterli. Tek istisna sudoers dosyasıdır: ona hiçbir zaman doğrudan editörle dokunma, `visudo` kullan (bölüm 11).

## 4. Disk Partisyonlama: LVM ve Şifreleme

### Partition, dosya sistemi, mount point temel kavramları
Partition, bir diskin ayrılmış bölümüdür. Dosya sistemi (ext4 gibi) o bölüme nasıl dosya yazılıp okunacağını belirler. Mount point, o bölümün Linux dizin ağacında NEREDE görüneceğidir (ör. /boot, /, /home). /boot çekirdek dosyalarını tutar ve genelde ŞİFRELENMEZ (bootloader'ın okuyabilmesi gerekir); geri kalan her şey şifreli LVM içinde olabilir.

### LVM: Physical Volume / Volume Group / Logical Volume ilişkisi
LVM (Logical Volume Manager), diskleri esnek şekilde bölümlemeni sağlayan bir katmandır. Physical Volume (PV): LVM'e verilen ham disk/partition. Volume Group (VG): birden fazla PV'nin birleştiği havuz. Logical Volume (LV): bu havuzdan kestiğin, gerçek mount edilebilir "sanal partition". Zincir: disk → PV → VG → LV → dosya sistemi → mount point.

### LUKS ile disk şifreleme mantığı
LUKS (Linux Unified Key Setup), Linux'ta disk şifrelemesinin standardıdır. Şifreli bir partition açılışta parola istemeden mount edilemez — disk çalınsa bile içerik okunamaz. Bu projede LVM, LUKS'un ÜZERİNE kurulur: önce partition LUKS ile şifrelenir (sda5_crypt gibi bir "crypt" cihazı oluşur), sonra o cihazın İÇİNE LVM (PV/VG/LV) kurulur. Sıralama: partition → LUKS şifreleme → LVM → dosya sistemleri.

### "En az 2 şifreli bölüm" ne demek
Subject'in istediği, diskte iki ayrı şifreli kap açman değil: tek bir LUKS kabının içinde LVM ile en az iki mantıksal birim (LV) oluşturman yeterlidir. Aşağıdaki şemada root, swap ve home diye üç LV var; üçü de aynı şifreli kabın içinde olduğu için üçü de şifrelidir ve şart fazlasıyla karşılanır. /boot bunun dışındadır, sayıya dahil değildir.

### En az 2 şifreli LVM partisyonu kurulum sihirbazında nasıl oluşturulur
Debian kurulumunda "Manuel" partisyonlamayı seç > diskte küçük bir /boot partition'ı ayır (şifrelenmeyecek) > kalan alanı "şifreli birim yapılandır" ile şifrele, bir parola belirle (unutma, disk kilidini bu açar) > şifreli alanı "LVM birimi yapılandır" ile PV yap, bir VG oluştur > VG içinde root, swap, home için ayrı LV'ler oluştur, her birine dosya sistemi (ext4, swap) ve mount point ata. DİKKAT: burada belirlediğin şifreleme parolası, ileride kullanıcı hesabına gireceğin login parolasıyla AYNI ŞEY DEĞİL — bu, VM her açıldığında diski kilidinden çıkarmak için sorulan, tamamen ayrı bir parola.

### Örnek şema (/boot, root, swap, home) ve boyutlandırma ilkesi
Örnek: /boot (500MB, şifresiz) + şifreli LVM içinde root (~10GB), swap (RAM'in 1-2 katı; 1-2GB RAM'de 2GB swap yeterli), home (kalan alan). Subject'teki örnek 8GB'lık bir diskte veriliyor — SEN kendi disk boyutuna göre ORANLA, örneği birebir kopyalama. "Gereksiz yer kaplama" uyarısını ciddiye al: aşırı büyük swap ya da gereksiz büyük root, savunmada "neden bu kadar" sorusunu doğurur.

### Kurulum sihirbazının arka planda yaptığının komut karşılığı (kavramsal)
```bash
cryptsetup luksFormat /dev/sda5
cryptsetup open /dev/sda5 sda5_crypt
pvcreate /dev/mapper/sda5_crypt
vgcreate VGname /dev/mapper/sda5_crypt
lvcreate -L 10G -n root VGname
lvcreate -L 2G  -n swap VGname
lvcreate -l 100%FREE -n home VGname
```
Sihirbaz bunu tıklamalarla senin için yapıyor; bu komutları görmek LVM'in NEDEN tercih edildiğini de açıklıyor: `lvextend` ile ileride bir LV'yi disk yeniden partitionlamadan büyütebilirsin — ham partition'larla bu mümkün değildir.

### Doğrulama komutları: lsblk, pvs, vgs, lvs
```bash
lsblk   # disk/partition/LV ağacını gösterir
pvs     # Physical Volume'leri listeler
vgs     # Volume Group'ları listeler
lvs     # Logical Volume'leri listeler
```
Kurulum bittikten sonra bu dört komutla yapının beklediğin gibi olduğunu doğrula; savunmada da aynı komutlarla "LVM aktif mi" sorusuna canlı cevap vereceksin.

## 5. Zorunlu Erişim Kontrolü: AppArmor vs SELinux

### DAC ile MAC (Mandatory Access Control) farkı
Discretionary Access Control (DAC), klasik Linux izin sistemidir (rwx, kullanıcı/grup) — dosyanın SAHİBİ izinleri belirler. Mandatory Access Control (MAC) ise sistem çapında, kullanıcının bile değiştiremeyeceği ek bir kural katmanıdır: "bu program SADECE şu dosyalara, şu şekilde erişebilir" diye merkezi politika dayatır. Bir servis ele geçirilse bile MAC, saldırganın sistemin geri kalanına sıçramasını engeller.

### AppArmor: profil mantığı, aa-status, Debian'da açılışta aktiflik
Debian'ın varsayılan MAC aracıdır. Profil tabanlı çalışır: her uygulama için `/etc/apparmor.d/` altında bir profil dosyası, o uygulamanın hangi dosyalara okuma/yazma/çalıştırma izni olduğunu tanımlar.
```bash
sudo aa-status
```
Bu komut kaç profilin "enforce" (zorlanan) ve kaç tanesinin "complain" (sadece loglanan) modda olduğunu gösterir. Açılışta otomatik başlaması için servisin systemctl ile enabled olması gerekir.

### SELinux: enforcing/permissive modları, sestatus
Rocky'nin varsayılan MAC aracıdır, AppArmor'dan daha ayrıntılıdır: dosya YOLUNA değil, dosyanın "context" (etiket) bilgisine göre çalışır. İki ana modu vardır: enforcing (kurallar zorlanır) ve permissive (ihlaller sadece loglanır).
```bash
sestatus
```

### Rocky özel durumu: KDump gerekmez, ama SELinux zorunlu
Subject, Rocky'nin SELinux'u enforcing modda ve açılışta aktif tutmasını şart koşuyor (KDump kurulumunu ise muaf tutuyor). Rocky'ye gitmeyeceğin için README karşılaştırması açısından bu kadarını bilmen yeterli.

### Savunmada "bu ne işe yarar" sorusuna hazırlık
Muhtemel soru: "AppArmor/SELinux ne işe yarar, neden var?" Tek cümlelik cevap: "Kullanıcı izinlerinin ötesinde, sistem çapında bir programın erişebileceği kaynakları sınırlayan zorunlu bir güvenlik katmanı; bir servis ele geçirilse bile hasarı sınırlar."

## 6. SSH Servisi ve Uzaktan Erişim Güvenliği

### SSH'ın çalışma mantığı (kısaca)
SSH (Secure Shell), bir makineye ağ üzerinden şifreli şekilde uzaktan komut satırı erişimi sağlayan protokol/servistir. Sunucu tarafında sshd (SSH daemon) dinlemede olur, istemci `ssh` komutuyla bağlanır. Bu proje SSH'ı savunmanın omurgası yapar: değerlendirici VM'ine SSH ile bağlanıp gerçek zamanlı test yapacak.

### sshd_config üzerinden port değişikliği (22 → 4242)
`/etc/ssh/sshd_config` dosyasında:
```
Port 4242
```
satırını ekle/düzenle. Değişiklikten sonra servisi yeniden başlat:
```bash
sudo systemctl restart sshd
```

### Root ile SSH girişinin kapatılması (PermitRootLogin no)
Aynı dosyada:
```
PermitRootLogin no
```
Bu, root'un doğrudan SSH ile giriş yapmasını engeller — root'a HER ZAMAN normal kullanıcı+sudo üzerinden erişilmeli, asla doğrudan değil.

### Servisi yeniden başlatma ve port dinlediğini doğrulama (ss -tunlp)
```bash
sudo systemctl restart sshd
ss -tunlp | grep 4242
```
Çıktıda 4242 portunun LISTEN durumda ve sshd'ye ait olduğunu görmelisin.

### Önce SSH'ı ayarla, gerisini host'tan bağlanarak yap
VirtualBox penceresi ile ana makinen arasında pano paylaşımı yoktur: VM konsolunda her şeyi harf harf elle yazarsın, uzun bir `secure_path` satırını ya da pwquality kurallarını böyle yazmak hem yorucu hem hataya açıktır. Bu yüzden SSH, kurulum sonrası sıradaki üçüncü ama en kârlı adımdır (bu bölüm + bölüm 1'deki port yönlendirme; sıranın tamamı bölüm 3'te). SSH çalışır çalışmaz ana makinenin kendi terminalinden bağlanırsın:
```bash
ssh login@127.0.0.1 -p 4242
```
Artık kopyala-yapıştır, kaydırma ve düzgün bir terminal kullanabilirsin; projenin geri kalanını böyle yapmak hem çok daha hızlıdır hem yazım hatalarını keser. Ayrıca SSH'ın gerçekten dışarıdan çalıştığını da her gün doğrulamış olursun.

### Savunmada yeni hesapla bağlantı testi
Değerlendirici "yeni bir hesap açalım, onunla SSH ile bağlanalım" diyecek — yani hem kullanıcı açma pratiğini hem SSH'ın gerçekten 4242'de ve root'suz çalıştığını AYNI ANDA test ediyor. Bu ikisini birlikte prova et.

## 7. Güvenlik Duvarı: UFW vs firewalld

### Firewall mantığı: varsayılan red, istisna izin
Bir firewall, gelen/giden ağ trafiğini kurallara göre süzer. Bu projede felsefe "varsayılan red, istisna izin": HER ŞEYİ kapat, sadece ihtiyacın olan tek portu (4242) aç.

### UFW ile sadece 4242 portunu açma (Debian)
```bash
sudo ufw allow 4242/tcp
sudo ufw enable
sudo ufw status
```
UFW (Uncomplicated Firewall), Debian'da iptables'ı basitleştiren bir ön yüzdür.

### firewalld ile zone / service / port kavramları (Rocky)
```bash
sudo firewall-cmd --permanent --add-port=4242/tcp
sudo firewall-cmd --reload
sudo firewall-cmd --list-port
```
UFW'den farklı olarak "zone" (bölge) kavramı vardır — her arayüz bir zone'a atanır, kurallar zone bazlı tanımlanır. `--permanent` olmadan yaptığın değişiklik reboot'ta kaybolur, `--reload` ile devreye alınır.

### Açılışta otomatik aktif olacak şekilde servis etkinleştirme
```bash
sudo systemctl enable ufw        # Debian
sudo systemctl enable firewalld  # Rocky
```
Subject açıkça "firewall VM başlar başlamaz aktif olmalı" diyor — enable etmeyi unutursan reboot sonrası firewall kapalı kalır, ciddi puan kaybı olur.

### Durum doğrulama: ufw status, firewall-cmd --state / --list-port
```bash
sudo ufw status
sudo firewall-cmd --state
sudo firewall-cmd --list-port
```
Savunmadan hemen önce bu kontrolü alışkanlık haline getir.

## 8. Hostname Yapılandırması

### hostname, /etc/hostname, /etc/hosts ilişkisi
`/etc/hostname` makinenin adını tek satır olarak tutar. `/etc/hosts` ise IP-isim eşleşmelerini tutar; genelde 127.0.1.1 satırında hostname'in de geçmesi gerekir, yoksa bazı komutlar (sudo dahil) yavaşlar/hata verir.

### login+42 formatı (örnek: hyahyato42)
Hostname'in 42 login'in + "42" olması gerekiyor (subject'teki örnek wil42; senin login'ine göre kendi karşılığını kullan).

### Kalıcı değiştirme (hostnamectl) ve savunmada anlık değiştirme farkı
```bash
sudo hostnamectl set-hostname yenihostname
```
Bu komut hem `/etc/hostname`'i günceller hem anlık uygular (reboot gerekmez, ama yeni terminal/oturum açman gerekebilir). Subject, savunma sırasında hostname'i DEĞİŞTİRTECEĞİNİ söylüyor — bu komutu ezbere bilmen gerekiyor, çünkü canlı, izlenerek yapacaksın.

## 9. Kullanıcı ve Grup Yönetimi

### root dışında kendi login'inle kullanıcı açma
```bash
sudo adduser login
```
`adduser` (Debian'a özgü, etkileşimli, "dostane") ya da `useradd -m login` (daha ham, manuel parola atama gerektirir) ile root dışında, kendi login'inle bir kullanıcı açarsın.

### user42 ve sudo gruplarına ekleme (usermod -aG)
```bash
sudo usermod -aG user42 login
sudo usermod -aG sudo login
```
`-a` (append/ekle) ÇOK KRİTİK: `-a` olmadan `-G` kullanırsan kullanıcının var olan TÜM ikincil gruplarını SİLİP sadece belirttiğin grupla değiştirirsin — tipik ve ciddi bir tuzak.

### groups, id komutlarıyla doğrulama
```bash
groups login
id login
```
`groups`, kullanıcının üye olduğu tüm grupları listeler; `id` hem kullanıcı hem grup ID'lerini (UID/GID) gösterir. Her ikisinde de user42 ve sudo görünmeli.

### Savunmada yeni kullanıcı oluşturup gruba atama pratiği
Değerlendirici senden CANLI yeni bir kullanıcı açıp bir gruba atamanı isteyecek. `adduser` + `usermod -aG` komutlarını ezbere, tereddütsüz yazabilmen gerekiyor — subject'te açıkça "peer review'da test edileceği" yazan iki maddeden biri.

## 10. Parola Politikası: PAM, login.defs, chage

### PAM'in rolü (kısaca)
PAM (Pluggable Authentication Modules), Linux'ta kimlik doğrulamayı merkezi, eklenti tabanlı modüllerle çözen bir çerçevedir. Parola karmaşıklık kuralları (pam_pwquality gibi) PAM modülleri aracılığıyla `/etc/pam.d/common-password` (Debian) dosyasına eklenir.

### /etc/login.defs: PASS_MAX_DAYS (30), PASS_MIN_DAYS (2), PASS_WARN_AGE (7)
```
PASS_MAX_DAYS   30
PASS_MIN_DAYS   2
PASS_WARN_AGE   7
```
PASS_MAX_DAYS: parolanın kaç günde bir zorunlu süresi dolsun. PASS_MIN_DAYS: değiştirdikten sonra tekrar değiştirmeden önceki minimum bekleme (kullanıcının parolayı art arda değiştirip eski parolaya "dönmesini" engeller). PASS_WARN_AGE: süre dolmadan kaç gün önce uyarı verilsin. DİKKAT: bu dosya sadece YENİ kullanıcılara varsayılan olur — VAR OLAN kullanıcılara (root dahil) `chage` ile AYRICA uygulaman gerekir.

### pam_pwquality ile karmaşıklık: min 10 karakter, büyük/küçük harf + rakam, 3'ten fazla ardışık aynı karakter yasağı
`/etc/security/pwquality.conf` içinde:
```
minlen = 10
ucredit = -1
lcredit = -1
dcredit = -1
maxrepeat = 3
```
minlen: minimum uzunluk. ucredit/lcredit/dcredit = -1: sırasıyla en az 1 büyük harf, 1 küçük harf, 1 rakam ZORUNLU (eksi değer "zorunlu" demektir — kafa karıştırıcı ama ezberlenmesi gereken bir PAM tuhaflığı). maxrepeat = 3: 3'ten fazla ardışık AYNI karakter yasak.

### Kullanıcı adını parolada yasaklama
```
reject_username
enforce_for_root
```
`reject_username`, parolanın kullanıcı adını içermesini engeller. `enforce_for_root` OLMADAN bu kurallar ROOT'a UYGULANMAZ — subject "root parolası da bu politikaya uymalı" dediği için bu satırı eklemen gerekiyor, sıkça unutulan bir ayrıntı.

### difok kuralı: yeni parolanın eskisinden en az 7 karakter farklı olması (root hariç)
```
difok = 7
```
Subject bunun ROOT'a uygulanmayacağını AÇIKÇA belirtiyor — tek istisna budur.

### Politika sonrası TÜM hesapların (root dahil) parolasının değiştirilmesi
Bütün kuralları yazdıktan sonra, sistemde zaten var olan hesapların parolaları henüz yeni kurallara göre belirlenmemiştir. Subject açıkça, config bitince TÜM parolaları (root dahil) YENİDEN değiştirmeni istiyor:
```bash
sudo passwd root
sudo passwd login
```

### Var olan hesaplara login.defs değerlerini chage ile geriye dönük uygulama
login.defs sadece YENİ oluşturulacak kullanıcıları etkiler; root ve senin kullanıcın zaten VARDI, o yüzden onlara elle vermen gerekir:
```bash
sudo chage -M 30 -m 2 -W 7 root
sudo chage -M 30 -m 2 -W 7 login
```
-M: max gün, -m: min gün, -W: uyarı günü — login.defs'teki üç değerin var olan hesaplara uygulanma yolu budur, atlanırsa politika sadece kağıt üzerinde kalır.

### chage -l ile doğrulama
```bash
sudo chage -l login
```
Bir kullanıcının parola yaşlanma bilgilerini (son değişiklik, max/min gün, uyarı günü) gösterir — hem kendi kontrolün hem savunmada "politika gerçekten uygulanmış mı" kanıtı için kullanılır.

## 11. sudo Yapılandırması ve Loglama

### sudoers dosyasını sadece visudo ile düzenlemenin önemi
```bash
sudo visudo
```
sudoers dosyasını DOĞRUDAN bir editörle AÇMA — sözdizimi hatası sudo'yu TAMAMEN kilitleyebilir, root bile düzeltemez. visudo, kaydetmeden önce sözdizimini kontrol eder. Bu proje için `/etc/sudoers.d/` altına ayrı bir dosya oluşturmak, ana sudoers dosyasını bozma riskini azaltır.

### passwd_tries=3 ile deneme sınırı
```
Defaults passwd_tries=3
```
Yanlış parola girişini 3 denemeyle sınırlar.

### Yanlış parolada özel mesaj (badpass_message)
```
Defaults badpass_message="Kendi mesajın buraya"
```
Subject "kendi seçtiğin bir mesaj" diyor — serbest metin, ezbere bir cümle hazırla.

### log_input / log_output ile /var/log/sudo/ altına loglama
log_input / log_output ile TAM oturum (yazdığın komutlar VE ekrana basılan çıktı) kaydedilir. Bu kayıtların nereye yazılacağını iolog_dir belirler:
```
Defaults log_input, log_output
Defaults iolog_dir="/var/log/sudo/"
```
`/var/log/sudo/` klasörünü önce sen oluşturmalısın (`sudo mkdir -p /var/log/sudo`). Kayıtları `sudoreplay <id>` ile bir video gibi geri oynatabilirsin — I/O logging'in ayırt edici özelliği budur.

### requiretty (TTY modu)
```
Defaults requiretty
```
sudo'nun sadece gerçek bir terminal (TTY) üzerinden çalıştırılmasını zorunlu kılar — arka plandaki script'ler sudo çalıştıramaz, bir güvenlik önlemidir.

### secure_path ile PATH kısıtlama
```
Defaults secure_path="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"
```
sudo çalıştırılırken kullanılabilecek PATH'i bu listeyle sınırlar — kullanıcının kendi PATH'ine sızdırdığı zararlı bir "sahte" binary'nin sudo ile çalıştırılmasını engeller.

## 12. monitoring.sh: İzleme Betiği ve Cron

### Betiğin görevi ve wall komutunun rolü
Betiğin görevi sistem durumunu (CPU, RAM, disk, ağ vb.) TÜM açık terminallere yayınlamaktır. Bunu `wall` komutu yapar — sistemdeki tüm oturum açmış kullanıcıların terminaline mesaj basar (broadcast).

### İstenen bilgi kalemleri ↔ hangi komut/dosya eşleştirmesi
```
Mimari/kernel     : uname -a
Fiziksel CPU      : lscpu | grep "Socket(s)"
vCPU              : nproc
RAM kullanımı     : free -m
Disk kullanımı    : df -h /
CPU yükü          : top -bn1 | grep "Cpu(s)"  (mpstat de olur ama sysstat paketi ister)
Son reboot        : who -b  (ya da uptime -s)
LVM aktif mi      : lsblk | grep lvm  (ya da vgs)
Aktif bağlantı    : ss -ta | grep ESTAB | wc -l
Kullanıcı sayısı  : who | wc -l
IP + MAC          : ip a  (tek komut yeter — "inet" satırı IP, "link/ether" satırı MAC)
sudo komut sayısı : /var/log/sudo/ log dosyasındaki satır/komut sayısı
```
Bu tablo bölüm 11'deki log_output ile bağlantılı: sudo sayacı için orada kurduğun log dosyasını grep'leyeceksin.

### Betiği çalıştırılabilir yapma: shebang ve chmod
Betiğin en üstüne `#!/bin/bash` (shebang) satırını koy, sonra çalıştırma izni ver:
```bash
chmod +x /usr/local/bin/monitoring.sh
```
Bu ikisi olmadan cron betiği DOĞRUDAN çalıştıramaz — "yazdığım script çalışmıyor" şikayetlerinin en sık nedeni budur.

### Açılışta ve her 10 dakikada çalıştırma: cron (@reboot, */10 * * * *)
```bash
crontab -e
```
```
@reboot /usr/local/bin/monitoring.sh
*/10 * * * * /usr/local/bin/monitoring.sh
```
İlk satır açılışta bir kez, ikinci satır her 10 dakikada bir çalıştırır.

### Savunmada betiği değiştirmeden durdurma
Subject "script'i DEĞİŞTİRMEDEN durdurman isteneceğini" söylüyor. Cevap script'i silmek/düzenlemek DEĞİL — cron job'unu geçici devre dışı bırakmaktır:
```bash
crontab -e   # ilgili satırın başına # koy, kaydet
```

### Hatasız (stderr'siz) çalışmayı garanti etme
Değişkenlerin boş dönebileceği durumları (ör. hiç sudo komutu çalıştırılmamışsa log dosyası boş) kontrol et, bulunamayan komutlardan hata basmasını engelle — subject "hiçbir hata gösterilmemeli" diyor, bu kelimenin tam anlamıyla ciddiye alınmalı.

S: Bu proje ne yapıyor, kısaca anlat?

## Ek — Hızlı Referans

### Sık karışan terimlerin tek satırlık tanımları
```
LVM      : Esnek disk/partition yönetim katmanı (PV → VG → LV)
LUKS     : Linux disk şifreleme standardı
PAM      : Eklenti tabanlı kimlik doğrulama çerçevesi
MAC      : Mandatory Access Control — sistem çapında zorunlu erişim kısıtı
DAC      : Discretionary Access Control — klasik sahip/izin sistemi
TTY      : Gerçek bir terminal oturumu
cron     : Zamanlanmış görev çalıştırıcı
systemd  : Modern Linux servis/başlatma yöneticisi (systemctl ile kontrol edilir)
```

### Hızlı doğrulama komutları listesi
```bash
sestatus              # SELinux durumu (Rocky)
aa-status              # AppArmor durumu (Debian)
ufw status             # Firewall durumu (Debian)
firewall-cmd --state   # Firewall durumu (Rocky)
ss -tunlp               # Açık portlar
chage -l login         # Parola politikası durumu
crontab -l             # Zamanlanmış görevler
lsblk / vgs / lvs       # LVM yapısı
```

### Savunmadan önce son gözden geçirme kontrol listesi
(1) VM'de hiçbir snapshot yok mu kontrol et. (2) `ss -tunlp` ile sadece 4242'nin açık olduğunu doğrula. (3) `aa-status` ile AppArmor'ın enforce/aktif olduğunu doğrula. (4) `chage -l` ile parola politikasının TÜM hesaplara (root dahil) uygulandığını doğrula. (5) `crontab -l` ile monitoring.sh'in kayıtlı olduğunu doğrula. (6) `hostnamectl status` ile hostname'in doğru formatta olduğunu doğrula.

function moduUygula(mod) {
  document.documentElement.dataset.mod = mod;
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) meta.setAttribute("content", mod === "gunduz" ? "#EBEFF3" : "#0F1720");
  const d = document.getElementById("modDugme");
  d.innerHTML = mod === "gunduz" ? AY_IKON : GUNES_IKON;
  d.setAttribute("aria-label", mod === "gunduz" ? "Gece moduna geç" : "Gündüz moduna geç");
}
let aktifMod = depo.oku("b2r.mod", null);
if (!aktifMod) {
  aktifMod = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "gunduz" : "gece";
}

document.getElementById("modDugme").addEventListener("click", () => {
  aktifMod = aktifMod === "gunduz" ? "gece" : "gunduz";

  moduUygula(aktifMod);
});

/* ---------- Kaynak metni bölümlere ayır ---------- */
const kaynakMetin = document.getElementById("kaynak").textContent;

function bolumlereAyir(metin) {
  const satirlar = metin.split("\n");
  const bolumler = [];
  let simdiki = null;
  let kodIcinde = false;
  for (const satir of satirlar) {
    if (satir.startsWith("```")) kodIcinde = !kodIcinde;
    if (!kodIcinde && satir.startsWith("## ")) {
      simdiki = { baslik: satir.slice(3).trim(), satirlar: [] };
      bolumler.push(simdiki);
    } else if (simdiki) {
      simdiki.satirlar.push(satir);
    }
  }
  return bolumler.map((b, i) => ({
    no: i,
    baslik: b.baslik,
    kisaBaslik: b.baslik.replace(/^\d+\.\s*/, "").replace(/^(Giriş|Ek)\s+—\s+/, ""),
    numara: (b.baslik.match(/^(\d+)\./) || [null, null])[1],
    metin: b.satirlar.join("\n").trim()
  }));
}
const BOLUMLER = bolumlereAyir(kaynakMetin);

/* ---------- Küçük markdown çizici ---------- */
function kacir(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function satiriCiz(s) {
  return kacir(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}
function markdownCiz(metin) {
  const satirlar = metin.split("\n");
  let html = "", kodIcinde = false, kodTampon = [];
  for (const satir of satirlar) {
    if (satir.startsWith("```")) {
      if (kodIcinde) { html += "<pre><code>" + kacir(kodTampon.join("\n")) + "</code></pre>"; kodTampon = []; }
      kodIcinde = !kodIcinde;
      continue;
    }
    if (kodIcinde) { kodTampon.push(satir); continue; }
    if (satir.startsWith("### ")) { html += "<h3>" + satiriCiz(satir.slice(4)) + "</h3>"; continue; }
    if (satir.trim() === "") continue;
    html += "<p>" + satiriCiz(satir) + "</p>";
  }
  if (kodTampon.length) html += "<pre><code>" + kacir(kodTampon.join("\n")) + "</code></pre>";
  return html;
}

/* ---------- Arama indeksi ---------- */
/* Sözlük satırları ve tablo satırları doğrudan kaynaktan ayrıştırılır,
   böylece rehber ile uygulama arasında metin farkı oluşmaz. */
function sozlukAyristir() {
  const kayitlar = [];
  const gorulen = new Set();
  BOLUMLER.forEach(bolum => {
    const satirlar = bolum.metin.split("\n");
    let kodIcinde = false;
    satirlar.forEach(satir => {
      if (satir.startsWith("```")) { kodIcinde = !kodIcinde; return; }
      if (!kodIcinde) return;
      const es = satir.match(/^([^:#]{2,30}?)\s+:\s+(.+)$/);
      if (!es) return;
      const terim = es[1].trim(), izah = es[2].trim();
      const anahtar = terim.toLowerCase();
      if (gorulen.has(anahtar)) return;
      gorulen.add(anahtar);
      kayitlar.push({ terim, izah, bolum: bolum.no, tur: "sozluk" });
    });
  });
  return kayitlar;
}

/* ---------- Komut fihristi: rehberdeki komutlar tek listede ---------- */
const KOMUT_BASLARI = ["sudo","apt","aptitude","dpkg","su","ssh","systemctl","ufw","firewall-cmd",
  "chage","passwd","adduser","usermod","groups","id","hostnamectl","visudo","crontab","chmod",
  "mkdir","lsblk","pvs","vgs","lvs","cryptsetup","pvcreate","vgcreate","lvcreate","uname","lscpu",

function komutFihristi() {
  const liste = [];
  const gorulen = new Set();
  BOLUMLER.forEach(bolum => {
    let kodIcinde = false;
    bolum.metin.split("\n").forEach(satir => {
      if (satir.startsWith("```")) { kodIcinde = !kodIcinde; return; }
      if (!kodIcinde) return;
      const temiz = satir.trim();
      if (!temiz || temiz.startsWith("#")) return;
      /* Sözlük satırları ("terim : açıklama") komut değildir */
      if (/^[^:]{2,30}\s+:\s+/.test(temiz)) return;
      const ilk = temiz.split(/[\s]+/)[0];
      if (KOMUT_BASLARI.indexOf(ilk) === -1) return;
      const komut = temiz.split("#")[0].trim();
      if (!komut || gorulen.has(komut)) return;
      gorulen.add(komut);
      liste.push({ komut, bolum: bolum.no });
    });
  });
  return liste;
}
const KOMUTLAR = komutFihristi();

/* ---------- Evo soru-cevapları: kaynaktan ayrıştırılır ---------- */
function evoAyristir() {
  const bolum = BOLUMLER.find(b => b.baslik.indexOf("Savunma (Evo)") !== -1);
  if (!bolum) return [];
  const kartlar = [];
  let grup = "", bekleyen = null;
  bolum.metin.split("\n").forEach(satir => {
    if (satir.startsWith("### ")) { grup = satir.slice(4).trim(); return; }
    if (satir.startsWith("S: ")) { bekleyen = { grup, soru: satir.slice(3).trim(), cevap: "" }; return; }
    if (satir.startsWith("C: ") && bekleyen) { bekleyen.cevap = satir.slice(3).trim(); kartlar.push(bekleyen); bekleyen = null; }
  });
  return kartlar;
}

const BOYUTLAR = [15, 16.5, 18.5, 20.5];

function boyutUygula(kademe) {

/* ==========================================================================
   Aranan ifadeyi bölüm metninde vurgulama
   ========================================================================== */
function vurgula(kok, sorgu) {
  const q = kucult((sorgu || "").trim());
  if (q.length < 2) return null;
  const yurutec = document.createTreeWalker(kok, NodeFilter.SHOW_TEXT, null);
  const dugumler = [];
  while (yurutec.nextNode()) dugumler.push(yurutec.currentNode);
  dugumler.forEach(dugum => {
    const metin = dugum.nodeValue;
    const kucuk = kucult(metin);
    let yer = kucuk.indexOf(q);
    if (yer === -1) return;
    const parca = document.createDocumentFragment();
    let son = 0;
    while (yer !== -1) {
      if (yer > son) parca.appendChild(document.createTextNode(metin.slice(son, yer)));
      const isaret = document.createElement("mark");
      isaret.textContent = metin.slice(yer, yer + q.length);
      parca.appendChild(isaret);
      son = yer + q.length;
      yer = kucuk.indexOf(q, son);
    }
    if (son < metin.length) parca.appendChild(document.createTextNode(metin.slice(son)));
    dugum.parentNode.replaceChild(parca, dugum);
  });
  return kok.querySelector("mark");
}

/* ==========================================================================
   Tam metin arama — sözlükte olmayan ifadeler de bulunabilsin
   ========================================================================== */
function metindeAra(sorgu) {
  const q = kucult((sorgu || "").trim());
  if (q.length < 3) return [];
  const sonuclar = [];
  BOLUMLER.forEach(bolum => {
    const kucuk = kucult(bolum.metin);
    let yer = kucuk.indexOf(q);
    if (yer === -1) return;
    let adet = 0, gezen = yer;
    while (gezen !== -1) { adet++; gezen = kucuk.indexOf(q, gezen + q.length); }
    const bas = Math.max(0, yer - 55);
    const bit = Math.min(bolum.metin.length, yer + q.length + 85);
    let kesit = bolum.metin.slice(bas, bit).replace(/[#`]+/g, "").replace(/\s+/g, " ").trim();
    sonuclar.push({
      bolum: bolum.no,
      adet,
      once: (bas > 0 ? "… " : "") + kesit.slice(0, Math.max(0, kucult(kesit).indexOf(q))),
      eslesen: kesit.substr(Math.max(0, kucult(kesit).indexOf(q)), q.length),
      sonra: kesit.slice(Math.max(0, kucult(kesit).indexOf(q)) + q.length) + (bit < bolum.metin.length ? " …" : "")
    });
  });
  return sonuclar.sort((a, b) => b.adet - a.adet);
}

/* ==========================================================================
   Uygulama içi geri: geçmiş yığını
   Telefonun geri tuşu uygulamadan atmasın diye her derinleşmede tarayıcı
   geçmişine bir adım eklenir; geri basıldığında o adımın geri işlevi çalışır.
   ========================================================================== */
const geriYigini = [];

function derinlesGit(geriIslevi) {
  geriYigini.push({ islev: geriIslevi, sekme: aktifSekme });
  try { history.pushState({ b2r: geriYigini.length }, ""); } catch (e) {}
}

/* Uygulama içindeki geri düğmeleri de bunu kullanır; böylece ekran ile
   tarayıcı geçmişi birbirinden kopmaz. */
function geriDon() {
  if (geriYigini.length) history.back();
}

/* Etkin sekmeye tekrar dokunulduğunda o sekmede açılmış alt ekranlar
   geçmişten de geri sarılır; yoksa sonraki geri basışları hiçbir şey
   yapmamış gibi görünür. */
function sekmeKokuneDon() {
  let i = geriYigini.length;
  while (i > 0 && geriYigini[i - 1].sekme === aktifSekme) i--;
  const adim = geriYigini.length - i;
  if (adim > 0) { history.go(-adim); return true; }
  return false;
}

/* Geçmiş adımının derinlik damgasına bakılır; böylece birden fazla adım
   birden geri gidilse de yığın ekranla aynı hizada kalır. */
window.addEventListener("popstate", olay => {
  const hedef = (olay.state && olay.state.b2r) || 0;
  let girdi = null;
  while (geriYigini.length > hedef) girdi = geriYigini.pop();
  if (girdi) girdi.islev();
  /* Yığın boşsa tarayıcı kendi işini yapar: uygulamadan çıkar. */
});

/* ==========================================================================
   Yanlış yapılan soruların defteri
   ========================================================================== */
function yanlisAnahtar(soru) { return soru.b + "|" + soru.soru; }
function yanlisDefteri() { return depo.oku("b2r.yanlislar", []); }

function yanlisKaydet(soru) {
  const defter = yanlisDefteri(), anahtar = yanlisAnahtar(soru);
  if (defter.indexOf(anahtar) === -1) { defter.push(anahtar); depo.yaz("b2r.yanlislar", defter); }
}

function yanlisKaldir(soru) {
  const defter = yanlisDefteri(), yeri = defter.indexOf(yanlisAnahtar(soru));
  if (yeri !== -1) { defter.splice(yeri, 1); depo.yaz("b2r.yanlislar", defter); }
}

function yanlisSorular() {
  const defter = yanlisDefteri();
  return SORULAR.filter(s => defter.indexOf(yanlisAnahtar(s)) !== -1);
}

/* Bir sorunun sonucunu tek yerden işler: aynı soru iki kez puanlanmaz. */
function sonucIsle(soru, dogruMu) {
  if (oturum.cevaplanan.indexOf(oturum.i) !== -1) return;
  oturum.cevaplanan.push(oturum.i);
  if (dogruMu) { oturum.dogru++; yanlisKaldir(soru); }
  else { oturum.yanlislar.push(soru); yanlisKaydet(soru); }
}

  sayfa.appendChild(kutu);

  const fihristDugme = olustur("button", "fihrist-giris");
  fihristDugme.innerHTML = '<span>Komut fihristi</span><span class="ok">›</span>';
  fihristDugme.addEventListener("click", () => {
    derinlesGit(() => { sekmeAc("ara", false); aramaSayfasiCiz(girdi.value); });
    komutFihristiCiz();
  });
  sayfa.appendChild(fihristDugme);

  const oneri = olustur("ul", "oneri");
  sayfa.appendChild(oneri);
  const sonuc = olustur("div", "sonuc");
  sayfa.appendChild(sonuc);

  function onerileriCiz(q) {
    oneri.innerHTML = "";
    if (!q) return;
    const kucuk = kucult(q);
    const bulunan = ARAMA_INDEKSI
      .filter(k => kucult(k.terim).indexOf(kucuk) !== -1)
      .sort((a, b) => {
        const ab = kucult(a.terim).indexOf(kucuk) === 0 ? 0 : 1;
        const bb = kucult(b.terim).indexOf(kucuk) === 0 ? 0 : 1;
        if (ab !== bb) return ab - bb;
        return a.terim.length - b.terim.length;
      })
      .slice(0, 8);
    bulunan.forEach(k => {
      const li = olustur("li");
      const d = olustur("button");
      d.innerHTML = '<span class="terim">' + kacir(k.terim) + "</span>" +
        (k.izah ? '<span class="kisa">' + kacir(k.izah) + "</span>" : "");
      d.addEventListener("click", () => {
        girdi.value = k.terim;
        oneri.innerHTML = "";
        sonuclariCiz(k.terim);
      });
      li.appendChild(d);
      oneri.appendChild(li);
    });
  }

  function sonuclariCiz(q) {
    sonuc.innerHTML = "";
    const kucuk = kucult(q.trim());
    if (!kucuk) return;
    const bulunan = ARAMA_INDEKSI.filter(k =>
      kucult(k.terim).indexOf(kucuk) !== -1 || (k.izah && kucult(k.izah).indexOf(kucuk) !== -1));
    if (!bulunan.length) {
      const metinde = metindeAra(q);
      if (!metinde.length) {
        const bos = olustur("p", "bos");
        bos.textContent = "“" + q + "” ne kavram listesinde ne de metinde geçiyor. Terimin bir kısmını yazmayı dene: örneğin “luks” ya da “sudo”.";
        sonuc.appendChild(bos);
        return;
      }
      metinSonuclariniCiz(q);
      return;
    }
    bulunan.slice(0, 20).forEach(k => {
      const kart = olustur("div", "sonuc-kart");
      const b = BOLUMLER[k.bolum];
      const h = olustur("h4");
      h.textContent = k.terim;
      kart.appendChild(h);
      if (k.izah) { const p = olustur("p"); p.textContent = k.izah; kart.appendChild(p); }
      const git = olustur("button", "nereden");
      git.textContent = (b.numara ? b.numara + ". " : "") + b.kisaBaslik + " bölümünde oku ›";
      git.addEventListener("click", () => {
        const sorgu = girdi.value;
        sekmeAc("oku", false);
        bolumAc(k.bolum, () => { sekmeAc("ara", false); aramaSayfasiCiz(sorgu); }, k.terim);
      });
      kart.appendChild(git);
      sonuc.appendChild(kart);
    });
    metinSonuclariniCiz(q);
  }

  /* Sözlükte karşılığı olmayan ifadeler için metnin kendisinde arama */
  function metinSonuclariniCiz(sorgu) {
    const bulunan = metindeAra(sorgu);
    if (!bulunan.length) return;
    const baslik = olustur("div", "metin-basligi");
    baslik.textContent = "metinde geçtiği yerler (" + bulunan.length + " bölüm)";
    sonuc.appendChild(baslik);
    bulunan.slice(0, 8).forEach(k => {
      const b = BOLUMLER[k.bolum];
      const kart = olustur("div", "sonuc-kart");
      const h = olustur("h4");
      h.textContent = (b.numara ? b.numara + ". " : "") + b.kisaBaslik;
      const adet = olustur("span", "adet");
      adet.textContent = k.adet + " kez";
      const kesit = olustur("p", "kesit");
      const kalin = olustur("b");
      kalin.textContent = k.eslesen;
      kesit.append(document.createTextNode(k.once), kalin, document.createTextNode(k.sonra));
      const git = olustur("button", "nereden");
      git.textContent = "bu bölümde oku ›";
      git.addEventListener("click", () => {
        const q2 = girdi.value;
        sekmeAc("oku", false);
        bolumAc(k.bolum, () => { sekmeAc("ara", false); aramaSayfasiCiz(q2); }, q2);
      });
      kart.append(h, adet, kesit, git);
      sonuc.appendChild(kart);
    });
  }

  girdi.addEventListener("input", () => { onerileriCiz(girdi.value.trim()); sonuclariCiz(girdi.value); });
  girdi.addEventListener("keydown", e => {
    if (e.key === "Enter") { oneri.innerHTML = ""; sonuclariCiz(girdi.value); girdi.blur(); }
  });
  sil.addEventListener("click", () => { girdi.value = ""; oneri.innerHTML = ""; sonuc.innerHTML = ""; girdi.focus(); });

  if (baslangic) { girdi.value = baslangic; sonuclariCiz(baslangic); }
}

/* Rehberdeki bütün komutlar tek listede — makine başındayken hızlı bakmak için */
function komutFihristiCiz() {
  const sayfa = $("#sayfaAra");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Arama";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const bilgi = olustur("div", "agac-baslik");
  bilgi.style.margin = "14px 0 4px";
  bilgi.textContent = KOMUTLAR.length + " komut — dokununca geçtiği bölüme gider";
  sayfa.appendChild(bilgi);

  let sonBolum = -1;
  KOMUTLAR.forEach(k => {
    if (k.bolum !== sonBolum) {
      sonBolum = k.bolum;
      const b = BOLUMLER[k.bolum];
      const baslik = olustur("div", "metin-basligi");
      baslik.textContent = (b.numara ? b.numara + ". " : "") + b.kisaBaslik;
      sayfa.appendChild(baslik);
    }
    const d = olustur("button", "fihrist-satir");
    d.textContent = k.komut;
    d.addEventListener("click", () => {
      sekmeAc("oku", false);
      bolumAc(k.bolum, () => { sekmeAc("ara", false); komutFihristiCiz(); }, k.komut.split(" ")[0]);
    });
    sayfa.appendChild(d);
  });
}

  { ad:"Yanlış yaptıkların", izah:"Takıldığın sorular burada birikir; doğru cevaplayınca listeden düşer.", tur:"yanlis" },
  { ad:"Savunma provası", izah:"Bütün bölümlerden, her türden karışık 15 soru — savunmada olduğu gibi ne geleceği belli değil.", tur:"prova" },
  { ad:"Bölüm bölüm çalış", izah:"Bir bölüm seç, o bölümün bütün soruları karışık gelsin.", tur:"bolum" },
  { ad:"Karışık test", izah:"Bütün bölümlerden çoktan seçmeli sorular.", tur:"secme" },
  { ad:"Komut dizme", izah:"Parçaları doğru sırada dizerek komutu kur.", tur:"dizme" },
  { ad:"Eşleştirme", izah:"monitoring.sh bilgi kalemlerini komutlarıyla eşleştir.", tur:"esles" },
  { ad:"Sayı ve değer testi", izah:"Parola politikasının rakamları: 30, 2, 7, 10, 3, 7.", tur:"sayi" },
  { ad:"Hata avı", izah:"Yanlış komutu ya da atlanan adımı bul.", tur:"hata" },
  { ad:"Senaryo soruları", izah:"“Değerlendirici şunu istedi, ne yaparsın?”", tur:"senaryo" },
  { ad:"Sözlük kartları", izah:"Kavramları kart çevirerek tekrar et.", tur:"sozluk" },
  { ad:"Kurulum ilerlemesi", izah:"Projeyi kurarken nerede kaldığını işaretleyerek takip et.", tur:"kurulum" },
  { ad:"Savunma kontrol listesi", izah:"Savunmadan önce tek tek işaretle.", tur:"kontrol" }
];

function modSorulari(tur) {
  if (tur === "secme") return SORULAR.filter(s => s.tip === "secme");
  if (tur === "dizme") return SORULAR.filter(s => s.tip === "dizme");
  if (tur === "esles") return SORULAR.filter(s => s.tip === "esles");
  if (tur === "sayi" || tur === "hata" || tur === "senaryo") return SORULAR.filter(s => s.alt === tur);
  return [];
}

function calisMenusuCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const liste = olustur("div", "mod-liste");
  MODLAR.forEach(m => {
    let sayi = 0;
    if (m.tur === "bolum") sayi = SORULAR.length;
    else if (m.tur === "prova") sayi = Math.min(15, SORULAR.length);
    else if (m.tur === "yanlis") sayi = yanlisSorular().length;
    else if (m.tur === "sozluk") sayi = SOZLUK_KARTLARI.length;
    else if (m.tur === "kontrol") sayi = KONTROL_LISTESI.length;
    else if (m.tur === "kurulum") sayi = KURULUM_ADIMLARI.length;
    else sayi = modSorulari(m.tur).length;
    if (!sayi && m.tur !== "yanlis") return;   /* yanlış defteri boşken de görünür */
    const d = olustur("button", "mod-kart");
    d.innerHTML = '<span class="ad">' + kacir(m.ad) + '</span><span class="izah">' + kacir(m.izah) +
      '</span><span class="sayi">' + sayi +
      (m.tur === "kontrol" ? " madde" : m.tur === "kurulum" ? " adım" : m.tur === "sozluk" ? " kart" : " soru") + "</span>";
    d.addEventListener("click", () => {
      derinlesGit(calisMenusuCiz);
      if (m.tur === "bolum") bolumSecimiCiz();
      else if (m.tur === "prova") oturumBaslat(karistir(SORULAR).slice(0, 15), m.ad);
      else if (m.tur === "yanlis") yanlisEkraniCiz();
      else if (m.tur === "sozluk") kartOturumu(SOZLUK_KARTLARI, "Sözlük kartları");
      else if (m.tur === "kontrol") kontrolListesiCiz();
      else if (m.tur === "kurulum") kurulumListesiCiz();
      else oturumBaslat(karistir(modSorulari(m.tur)), m.ad);
    });
    liste.appendChild(d);
  });
  sayfa.appendChild(liste);
}

function yanlisEkraniCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Çalışma yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const sorular = yanlisSorular();
  if (!sorular.length) {
    const bos = olustur("p", "bos");
    bos.textContent = "Yanlış defterin boş. Testleri çözdükçe takıldığın sorular buraya birikir, doğru cevapladıkça da listeden düşer.";
    sayfa.appendChild(bos);
    return;
  }

  const bilgi = olustur("div", "agac-baslik");
  bilgi.style.margin = "16px 0 6px";
  bilgi.textContent = sorular.length + " soruda takılmışsın";
  sayfa.appendChild(bilgi);

  const dagilim = {};
  sorular.forEach(s => { dagilim[s.b] = (dagilim[s.b] || 0) + 1; });
  const liste = olustur("div", "kontrol");
  Object.keys(dagilim).sort((a, b) => Number(a) - Number(b)).forEach(no => {

    const satir = olustur("div", "kontrol-oge");
    satir.style.cursor = "default";
    const sayi = olustur("span", "kutucuk");
    sayi.style.cssText = "color:var(--vurgu);border-color:var(--vurgu);font-family:var(--mono)";
    sayi.textContent = String(dagilim[no]);
    const ad = olustur("span");
    ad.textContent = no + ". " + (bolum ? bolum.kisaBaslik : "");
    satir.append(sayi, ad);
    liste.appendChild(satir);
  });
  sayfa.appendChild(liste);

  const eylem = olustur("div", "eylem");
  const basla = olustur("button", "ana");
  basla.textContent = "Çözmeye başla";
  basla.addEventListener("click", () => {
    derinlesGit(yanlisEkraniCiz);
    oturumBaslat(karistir(sorular), "Yanlış yaptıkların");
  });
  const temizle = olustur("button");
  temizle.textContent = "Defteri temizle";
  temizle.addEventListener("click", () => { depo.yaz("b2r.yanlislar", []); yanlisEkraniCiz(); });
  eylem.append(basla, temizle);
  sayfa.appendChild(eylem);

function bolumSecimiCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Çalışma yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const liste = olustur("div", "mod-liste");
  liste.style.marginTop = "14px";
  BOLUMLER.forEach(bolum => {
    if (!bolum.numara) return;
    const sorular = SORULAR.filter(s => String(s.b) === bolum.numara);
    if (!sorular.length) return;
    const d = olustur("button", "mod-kart");
    d.innerHTML = '<span class="ad">' + bolum.numara + ". " + kacir(bolum.kisaBaslik) +
      '</span><span class="sayi">' + sorular.length + " soru</span>";
    d.addEventListener("click", () => {
      derinlesGit(bolumSecimiCiz);
      oturumBaslat(karistir(sorular), bolum.numara + ". " + bolum.kisaBaslik);
    });
    liste.appendChild(d);
  });
