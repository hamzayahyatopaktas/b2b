/* ---------- Soru oturumu ---------- */
let oturum = null;

function oturumBaslat(sorular, baslik) {
  oturum = { sorular, i: 0, dogru: 0, yanlislar: [], cevaplanan: [], baslik };
  soruCiz();
}

function ilerlemeCiz(hedef) {
  const s = olustur("div", "ilerleme");
  const oran = Math.round((oturum.i / oturum.sorular.length) * 100);
  s.innerHTML = '<span>' + kacir(oturum.baslik) + "</span>" +
    '<span class="cubuk"><span class="dolu" style="width:' + oran + '%"></span></span>' +
    "<span>" + (oturum.i + 1) + "/" + oturum.sorular.length + "</span>";
  hedef.appendChild(s);
}

function izahKutusu(soru) {
  const k = olustur("div", "izah");
  k.textContent = soru.izah || "";
  const bolum = BOLUMLER.find(b => b.numara === String(soru.b));
  if (bolum) {
    const n = olustur("button", "nereden");
    n.textContent = bolum.numara + ". " + bolum.kisaBaslik + " bölümünde oku ›";
    n.addEventListener("click", () => {
      sekmeAc("oku", false);
      bolumAc(bolum.no, () => { sekmeAc("calis", false); soruCiz(); });
    });
    k.appendChild(n);
  }
  return k;
}

function sonrakiDugmesi(hedef, etiket) {
  const alan = olustur("div", "eylem");
  const d = olustur("button", "ana");
  d.textContent = etiket || (oturum.i === oturum.sorular.length - 1 ? "Sonucu gör" : "Sonraki soru");
  d.addEventListener("click", () => { oturum.i++; soruCiz(); });
  alan.appendChild(d);
  hedef.appendChild(alan);
  d.focus();
}

function soruCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  if (oturum.i >= oturum.sorular.length) { sonucCiz(); return; }
  ilerlemeCiz(sayfa);
  const soru = oturum.sorular[oturum.i];
  if (soru.tip === "secme") secmeCiz(sayfa, soru);
  else if (soru.tip === "dizme") dizmeCiz(sayfa, soru);
  else if (soru.tip === "esles") eslesCiz(sayfa, soru);
  window.scrollTo(0, 0);
}

const ALT_ETIKET = { test:"Kavram", sayi:"Sayı ve değer", hata:"Hata avı", senaryo:"Senaryo" };

function secmeCiz(sayfa, soru) {
  const kutu = olustur("div", "soru");
  const etiket = olustur("span", "etiket");
  etiket.textContent = "Bölüm " + soru.b + " · " + (ALT_ETIKET[soru.alt] || "Kavram");
  const metin = olustur("p", "metin");
  metin.textContent = soru.soru;
  kutu.append(etiket, metin);

  const secenekler = olustur("div", "secenekler");
  const harfler = ["A", "B", "C", "D", "E"];
  const dugmeler = [];
  /* Seçenekler her çizimde karıştırılır: doğru cevabın hep aynı şıkta olması
     "içeriği bilmeden şıkkı ezberleme" alışkanlığı doğurur. */
  const sira = karistir(soru.secenekler.map((_, n) => n));
  const dogruYer = sira.indexOf(soru.dogru);
  sira.forEach((asil, i) => {
    const d = olustur("button", "secenek");
    d.dataset.asil = String(asil);
    d.innerHTML = '<span class="harf">' + harfler[i] + "</span><span></span>";
    d.lastChild.textContent = soru.secenekler[asil];
    d.addEventListener("click", () => {
      if (d.disabled) return;
      dugmeler.forEach(x => { x.disabled = true; });
      dugmeler[dogruYer].classList.add("dogru");
      if (i !== dogruYer) d.classList.add("yanlis");
      sonucIsle(soru, i === dogruYer);
      kutu.appendChild(izahKutusu(soru));
      sonrakiDugmesi(sayfa);
    });
    dugmeler.push(d);
    secenekler.appendChild(d);
  });
  kutu.appendChild(secenekler);
  sayfa.appendChild(kutu);
}

function dizmeCiz(sayfa, soru) {
  const kutu = olustur("div", "soru");
  const etiket = olustur("span", "etiket");
  etiket.textContent = "Bölüm " + soru.b + " · " + (soru.komut ? "Komut dizme" : "Sıralama");
  const metin = olustur("p", "metin");
  metin.textContent = soru.soru;
  kutu.append(etiket, metin);

  const alan = olustur("div", "dizi-alan bos-alan");
  alan.dataset.ipucu = soru.komut ? "Parçalara dokunarak komutu buraya diz" : "Adımları sırayla buraya diz";
  const havuz = olustur("div", "havuz");
  const secilen = [];

  function tazele() {
    alan.classList.toggle("bos-alan", secilen.length === 0);
  }
  karistir(soru.parcalar).forEach(parca => {
    const d = olustur("button", "parca");
    d.textContent = parca;
    d.addEventListener("click", () => {
      if (alan.classList.contains("dogru-alan") || alan.classList.contains("yanlis-alan")) return;
      d.style.display = "none";
      const s = olustur("button", "parca");
      s.textContent = parca;
      s.addEventListener("click", () => {
        if (alan.classList.contains("dogru-alan") || alan.classList.contains("yanlis-alan")) return;
        s.remove();
        d.style.display = "";
        secilen.splice(secilen.indexOf(parca), 1);
        tazele();
      });
      alan.appendChild(s);
      secilen.push(parca);
      tazele();
    });
    havuz.appendChild(d);
  });
  kutu.append(alan, havuz);
  sayfa.appendChild(kutu);

  const eylem = olustur("div", "eylem");
  const kontrol = olustur("button", "ana");
  kontrol.textContent = "Kontrol et";
  kontrol.addEventListener("click", () => {
    const dogruMu = secilen.length === soru.parcalar.length &&
      secilen.every((p, i) => p === soru.parcalar[i]);
    alan.classList.add(dogruMu ? "dogru-alan" : "yanlis-alan");
    sonucIsle(soru, dogruMu);
    if (!dogruMu) {
      const d = olustur("div", "izah");
      d.innerHTML = "<strong>Doğrusu:</strong> ";
      const kod = olustur("code");
      kod.textContent = soru.parcalar.join(soru.komut ? " " : " → ");
      d.appendChild(kod);
      kutu.appendChild(d);
    }
    kutu.appendChild(izahKutusu(soru));
    eylem.remove();
    sonrakiDugmesi(sayfa);
  });
  eylem.appendChild(kontrol);
  sayfa.appendChild(eylem);
}

function eslesCiz(sayfa, soru) {
  const kutu = olustur("div", "soru");
  const etiket = olustur("span", "etiket");
  etiket.textContent = "Bölüm " + soru.b + " · Eşleştirme";
  const metin = olustur("p", "metin");
  metin.textContent = soru.soru;
  kutu.append(etiket, metin);

  const izgara = olustur("div", "esles");
  const solSutun = olustur("div", "esles-sutun");
  const sagSutun = olustur("div", "esles-sutun");
  let secili = null, kalan = soru.ciftler.length, hataVar = false;

  karistir(soru.ciftler).forEach(([sol]) => {
    const d = olustur("button", "esles-oge");
    d.textContent = sol;
    d.dataset.anahtar = sol;
    d.addEventListener("click", () => {
      if (d.classList.contains("tamam")) return;
      if (secili) secili.classList.remove("secili");
      secili = d; d.classList.add("secili");
    });
    solSutun.appendChild(d);
  });
  karistir(soru.ciftler).forEach(([sol, sag]) => {
    const d = olustur("button", "esles-oge sag");
    d.textContent = sag;
    d.dataset.esi = sol;
    d.addEventListener("click", () => {
      if (!secili || d.classList.contains("tamam")) return;
      if (d.dataset.esi === secili.dataset.anahtar) {
        d.classList.add("tamam"); secili.classList.remove("secili"); secili.classList.add("tamam");
        secili = null; kalan--;
        if (kalan === 0) bitir();
      } else {
        hataVar = true;
        d.classList.add("hata");
        setTimeout(() => d.classList.remove("hata"), 450);
      }
    });
    sagSutun.appendChild(d);
  });

  function bitir() {
    sonucIsle(soru, !hataVar);
    kutu.appendChild(izahKutusu(soru));
    sonrakiDugmesi(sayfa);
  }

  izgara.append(solSutun, sagSutun);
  kutu.appendChild(izgara);
  sayfa.appendChild(kutu);
}

function sonucCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const toplam = oturum.sorular.length;
  const bitis = olustur("div", "bitis");
  const puan = olustur("div", "puan");
  puan.textContent = oturum.dogru + "/" + toplam;
  const alt = olustur("div", "alt");
  const oran = oturum.dogru / toplam;
  alt.textContent = oran === 1 ? "Tamamı doğru. Bu bölüm savunmaya hazır."
    : oran >= 0.7 ? "İyi. Yanlışları bir kez daha oku, sonra tekrar dene."
    : "Bu bölümü okuma alanından bir kez daha geç, sonra tekrar dene.";
  bitis.append(puan, alt);

  if (oturum.yanlislar.length) {
    const kutu = olustur("div", "yanlislar");
    const b = olustur("h4");
    b.textContent = "Takıldığın sorular";
    kutu.appendChild(b);
    oturum.yanlislar.forEach(s => {
      const k = olustur("div", "sonuc-kart");
      const p = olustur("p");
      p.textContent = s.soru;
      const git = olustur("button", "nereden");
      const bolum = BOLUMLER.find(x => x.numara === String(s.b));
      git.textContent = "Bölüm " + s.b + "'de oku ›";
      git.addEventListener("click", () => {
        sekmeAc("oku", false);
        bolumAc(bolum.no, () => { sekmeAc("calis", false); sonucCiz(); });
      });
      k.append(p, git);
      kutu.appendChild(k);
    });
    bitis.appendChild(kutu);
  }
  sayfa.appendChild(bitis);

  const eylem = olustur("div", "eylem");
  const tekrar = olustur("button", "ana");
  tekrar.textContent = "Baştan çöz";
  tekrar.addEventListener("click", () => oturumBaslat(karistir(oturum.sorular), oturum.baslik));
  const cik = olustur("button");
  cik.textContent = "Çalışma yolları";
  cik.addEventListener("click", geriDon);
  eylem.append(tekrar, cik);
  sayfa.appendChild(eylem);
}

/* ---------- Kart oturumu (sözlük ve Evo) ---------- */
function kartOturumu(kartlar, baslik, hedefSayfa) {
  const sayfa = hedefSayfa || $("#sayfaCalis");
  let sira = karistir(kartlar), i = 0, bilinen = 0, acik = false, bilinmeyenler = [];

  function ciz() {
    sayfa.innerHTML = "";
    if (i >= sira.length) {
      const bitis = olustur("div", "bitis");
      const p = olustur("div", "puan");
      p.textContent = bilinen + "/" + sira.length;
      const a = olustur("div", "alt");
      a.textContent = "kart bildim";
      bitis.append(p, a);
      sayfa.appendChild(bitis);
      const eylem = olustur("div", "eylem");
      if (bilinmeyenler.length) {
        const kalanlar = olustur("button", "ana");
        kalanlar.textContent = "Bilemediklerin (" + bilinmeyenler.length + ")";
        kalanlar.addEventListener("click", () => {
          sira = karistir(bilinmeyenler); bilinmeyenler = []; i = 0; bilinen = 0; ciz();
        });
        eylem.appendChild(kalanlar);
      }
      const tekrar = olustur("button", bilinmeyenler.length ? "" : "ana");
      tekrar.textContent = "Yeniden karıştır";
      tekrar.addEventListener("click", () => {
        sira = karistir(kartlar); i = 0; bilinen = 0; bilinmeyenler = []; ciz();
      });
      const cik = olustur("button");
      cik.textContent = hedefSayfa ? "Listeye dön" : "Çalışma yolları";
      cik.addEventListener("click", geriDon);
      eylem.append(tekrar, cik);
      sayfa.appendChild(eylem);
      return;
    }
    const ilerleme = olustur("div", "ilerleme");
    ilerleme.innerHTML = "<span>" + kacir(baslik) + '</span><span class="cubuk"><span class="dolu" style="width:' +
      Math.round((i / sira.length) * 100) + '%"></span></span><span>' + (i + 1) + "/" + sira.length + "</span>";
    sayfa.appendChild(ilerleme);

    const kart = olustur("button", "kart");
    const k = sira[i];
    const on = olustur("div", "on" + (k.on.indexOf(" ") === -1 && /[-/_]/.test(k.on) ? " komut" : ""));
    on.textContent = k.on;
    kart.appendChild(on);
    if (acik) {
      const arka = olustur("div", "arka");
      arka.textContent = k.arka;
      kart.appendChild(arka);
    } else {
      const ip = olustur("div", "ipucu");
      ip.textContent = "Cevabı görmek için dokun";
      kart.appendChild(ip);
    }
    kart.addEventListener("click", () => { acik = !acik; ciz(); });
    sayfa.appendChild(kart);

    const eylem = olustur("div", "eylem");
    if (acik) {
      const yok = olustur("button");
      yok.textContent = "Bilemedim";
      yok.addEventListener("click", () => {
        if (bilinmeyenler.indexOf(sira[i]) === -1) bilinmeyenler.push(sira[i]);
        i++; acik = false; ciz();
      });
      const var_ = olustur("button", "ana");
      var_.textContent = "Bildim";
      var_.addEventListener("click", () => { bilinen++; i++; acik = false; ciz(); });
      eylem.append(yok, var_);
    } else {
      const cevir = olustur("button", "ana");
      cevir.textContent = "Cevabı göster";
      cevir.addEventListener("click", () => { acik = true; ciz(); });
      eylem.appendChild(cevir);
    }
    sayfa.appendChild(eylem);
    window.scrollTo(0, 0);
  }
  ciz();
}

/* ---------- Kurulum ilerlemesi ---------- */
function kurulumListesiCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Çalışma yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const tamam = depo.oku("b2r.kurulumAdim", []);
  const bilgi = olustur("div", "agac-baslik");
  bilgi.style.margin = "14px 0 10px";
  const sirada = KURULUM_ADIMLARI.findIndex((_, i) => tamam.indexOf(i) === -1);
  bilgi.textContent = tamam.length + "/" + KURULUM_ADIMLARI.length + " adım tamam" +
    (sirada === -1 ? " — hepsi bitti" : " · sıradaki: " + (sirada + 1) + ". adım");
  sayfa.appendChild(bilgi);

  const liste = olustur("div", "kontrol");
  KURULUM_ADIMLARI.forEach(([metin, bolumNo], i) => {
    const secili = tamam.indexOf(i) !== -1;
    const d = olustur("button", "kontrol-oge" + (secili ? " tikli" : "") + (!secili && i === sirada ? " sirada" : ""));
    const kutucuk = olustur("span", "kutucuk");
    kutucuk.textContent = secili ? "✓" : String(i + 1);
    if (!secili) kutucuk.style.cssText = "color:var(--sonuk);font-family:var(--mono);font-size:11px";
    const yazi = olustur("span");
    yazi.innerHTML = satiriCiz(metin);
    const nereden = olustur("span");
    nereden.style.cssText = "display:block;color:var(--sonuk);font-size:12.5px;margin-top:3px";
    nereden.textContent = "bölüm " + bolumNo;
    yazi.appendChild(nereden);
    d.append(kutucuk, yazi);
    d.addEventListener("click", () => {
      const g = depo.oku("b2r.kurulumAdim", []);
      const yeri = g.indexOf(i);
      if (yeri === -1) g.push(i); else g.splice(yeri, 1);
      depo.yaz("b2r.kurulumAdim", g);
      kurulumListesiCiz();
    });
    liste.appendChild(d);
  });
  sayfa.appendChild(liste);

  const eylem = olustur("div", "eylem");
  const sifirla = olustur("button");
  sifirla.textContent = "Sıfırla";
  sifirla.addEventListener("click", () => { depo.yaz("b2r.kurulumAdim", []); kurulumListesiCiz(); });
  eylem.appendChild(sifirla);
  sayfa.appendChild(eylem);
}

/* ---------- Kontrol listesi ---------- */
function kontrolListesiCiz() {
  const sayfa = $("#sayfaCalis");
  sayfa.innerHTML = "";
  const geri = olustur("button", "geri");
  geri.textContent = "‹ Çalışma yolları";
  geri.addEventListener("click", geriDon);
  sayfa.appendChild(geri);

  const tikli = depo.oku("b2r.kontrol", []);
  const bilgi = olustur("div", "agac-baslik");
  bilgi.style.margin = "14px 0 10px";
  bilgi.textContent = tikli.length + "/" + KONTROL_LISTESI.length + " madde tamam";
  sayfa.appendChild(bilgi);

  const liste = olustur("div", "kontrol");
  KONTROL_LISTESI.forEach(([metin, bolumNo], i) => {
    const secili = tikli.indexOf(i) !== -1;
    const d = olustur("button", "kontrol-oge" + (secili ? " tikli" : ""));
    const kutucuk = olustur("span", "kutucuk");
    kutucuk.textContent = "✓";
    const yazi = olustur("span");
    yazi.innerHTML = satiriCiz(metin) + ' <span style="color:var(--sonuk);font-size:12.5px">· bölüm ' + bolumNo + "</span>";
    d.append(kutucuk, yazi);
    d.addEventListener("click", () => {
      const g = depo.oku("b2r.kontrol", []);
      const yeri = g.indexOf(i);
      if (yeri === -1) g.push(i); else g.splice(yeri, 1);
      depo.yaz("b2r.kontrol", g);
      kontrolListesiCiz();
    });
    liste.appendChild(d);
  });
  sayfa.appendChild(liste);

  const eylem = olustur("div", "eylem");
  const sifirla = olustur("button");
  sifirla.textContent = "Listeyi sıfırla";
  sifirla.addEventListener("click", () => { depo.yaz("b2r.kontrol", []); kontrolListesiCiz(); });
  eylem.appendChild(sifirla);
  sayfa.appendChild(eylem);
}

/* ==========================================================================
   4) EVO
   ========================================================================== */
function evoSayfasiCiz() {
  const sayfa = $("#sayfaEvo");
  sayfa.innerHTML = "";

  const bilgi = olustur("div", "agac-baslik");
  bilgi.textContent = EVO_KARTLARI.length + " soru — savunmada sorulması muhtemel olanlar";
  sayfa.appendChild(bilgi);

  const eylem = olustur("div", "eylem");
  eylem.style.marginTop = "10px";
  const kartla = olustur("button", "ana");
  kartla.textContent = "Kart çevirerek çalış";
  kartla.addEventListener("click", () => {
    derinlesGit(evoSayfasiCiz);
    kartOturumu(EVO_KARTLARI.map(k => ({ on: k.soru, arka: k.cevap })), "Evo soruları", $("#sayfaEvo"));
  });
  eylem.appendChild(kartla);
  sayfa.appendChild(eylem);

  let sonGrup = "";
  EVO_KARTLARI.forEach(k => {
    if (k.grup !== sonGrup) {
      sonGrup = k.grup;
      const b = olustur("h3");
      b.style.cssText = "font-size:13px;color:var(--vurgu);font-family:var(--mono);margin:22px 0 8px;font-weight:500";
      b.textContent = k.grup;
      sayfa.appendChild(b);
    }
    const kart = olustur("div", "sonuc-kart");
    const s = olustur("p");
    s.style.fontWeight = "600";
    s.textContent = k.soru;
    const c = olustur("p");
    c.style.cssText = "margin-top:8px;color:var(--sonuk)";
    c.textContent = k.cevap;
    kart.append(s, c);
    sayfa.appendChild(kart);
  });
}

/* ==========================================================================
   Kurulum şeridi — ana ekrana ekleme
   ========================================================================== */
function zatenKurulu() {
  return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) ||
         window.navigator.standalone === true;
}

/* Yerel istem gelmeyen tarayıcılar için elle kurulum adımları */
function kurulumAdimlari() {
  const ua = navigator.userAgent || "";
  const iosMu = /iPhone|iPad|iPod/.test(ua) ||
                (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (iosMu) return ["Alt çubuktaki Paylaş düğmesine dokun", "Listeden “Ana Ekrana Ekle”yi seç", "Sağ üstten “Ekle”ye dokun"];
  if (/Android/.test(ua)) return ["Tarayıcının ⋮ menüsünü aç", "“Uygulamayı yükle” ya da “Ana ekrana ekle”ye dokun", "Açılan kutuda onayla"];
  return ["Adres çubuğunun sağındaki yükleme simgesine tıkla", "Ya da ⋮ menüsünden “Yükle”yi seç", "Açılan kutuda onayla"];
}

let kurulumSeridi = null;

function kurulumSeridiniKapat(kalici) {
  if (kurulumSeridi) { kurulumSeridi.remove(); kurulumSeridi = null; }
  if (kalici) depo.yaz("b2r.kurulum", "gizli");
}

function kurulumSeridiniGoster() {
  if (kurulumSeridi || zatenKurulu()) return;
  if (depo.oku("b2r.kurulum", null) === "gizli") return;

  const serit = olustur("div", "kurulum");
  serit.setAttribute("role", "dialog");
  serit.setAttribute("aria-label", "Uygulamayı ana ekrana ekle");
  const baslik = olustur("p", "baslik");
  baslik.textContent = "Ana ekrana ekle";
  const metin = olustur("p", "metin");
  metin.textContent = "Yolda internetsiz de açılsın diye uygulamayı telefonuna kurabilirsin.";
  serit.append(baslik, metin);

  const eylem = olustur("div", "eylem");
  const kapat = olustur("button");
  kapat.textContent = "Şimdi değil";
  kapat.addEventListener("click", () => kurulumSeridiniKapat(true));

  const kur = olustur("button", "ana");
  kur.textContent = "Yükle";
  kur.addEventListener("click", async () => {
    const olay = window.kurulumOlayi;
    if (olay) {
      window.kurulumOlayi = null;
      try {
        olay.prompt();
        const sonuc = await olay.userChoice;
        kurulumSeridiniKapat(sonuc && sonuc.outcome === "accepted");
        if (!(sonuc && sonuc.outcome === "accepted")) kurulumSeridiniGoster();
      } catch (e) { adimlariAc(); }
      return;
    }
    adimlariAc();
  });

  function adimlariAc() {
    /* Tarayıcı yerel istemi vermiyorsa elle kurulum yolunu göster */
    metin.textContent = "Tarayıcın otomatik kurulum penceresi açmıyor. Şu adımlarla ekleyebilirsin:";
    if (!serit.querySelector(".adimlar")) {
      const liste = olustur("ol", "adimlar");
      kurulumAdimlari().forEach(a => { const li = olustur("li"); li.textContent = a; liste.appendChild(li); });
      serit.insertBefore(liste, eylem);
    }
    kur.textContent = "Anladım";
    kur.onclick = () => kurulumSeridiniKapat(true);
  }

  eylem.append(kapat, kur);
  serit.appendChild(eylem);
  document.body.appendChild(serit);
  kurulumSeridi = serit;
}

/* Olay erken geldiyse yakalanmış olur; gelmediyse de şerit yine de gösterilir. */
window.addEventListener("kurulum-hazir", kurulumSeridiniGoster);
window.addEventListener("kurulum-bitti", () => kurulumSeridiniKapat(true));
setTimeout(kurulumSeridiniGoster, 1200);

/* ==========================================================================
   Başlangıç
   ========================================================================== */
altCubukCiz();
okumaListesiCiz();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}

</script>
